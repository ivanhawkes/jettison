# # Project Configuration
#
# Shared, repository-specific Worktrunk settings: hooks, dev-server URL, commit prompt
# additions. See https://worktrunk.dev/hook/ for hook types and execution order.
#
# The gates live in scripts/ so that `wt`, CI and a developer shell all run the same checks.

# Fast: clang-format --dry-run -Werror over the tracked sources (needs LLVM 21: 'devenv').
pre-commit = "./scripts/format-check.sh"

# Slower: format gate, Debug build, clang-tidy and the headless render test, with warnings
# as errors. Skips the Release build locally for speed; CI runs everything.
pre-merge = "./scripts/ci.sh --skip-release --werror --llvmpipe"

# Do not copy generated trees into new worktrees: build/ holds fetched dependencies and
# multi-hundred-MB build trees, .devenv the Nix dev shell, .cache the clangd index.
[step.copy-ignored]
exclude = [
	"build/",
	".devenv/",
	".cache/",
	"compile_commands.json",
]
