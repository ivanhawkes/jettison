version: 1
entities:
  - id: scene-root
    transform:
      translation: [0, 0, 0]
      rotation: [0, 0, 0]
      scale: [1, 1, 1]
  - id: main-camera
    camera:
      position: [2, 2, 2]
      rotation: [-0.615479709, 0, 2.35619449]
      fov: 45
      near: 0.1
      far: 10
      active: true
  - id: key-light
    transform:
      translation: [-2, 1, 2.5]
      rotation: [0, 0, 0]
      scale: [1, 1, 1]
    light:
      color: [1, 0.92, 0.78]
      intensity: 18
      ambient: [0.12, 0.12, 0.12]
      active: true
  - id: static-avocado
    parent: scene-root
    transform:
      translation: [-1.1, 0, 0]
      rotation: [0, 0, 0]
      scale: [12, 12, 12]
    mesh:
      model: ../models/Avocado.glb
  - id: animated-avocado
    parent: scene-root
    transform:
      translation: [1.1, 0, 0]
      rotation: [0, 0, 0]
      scale: [12, 12, 12]
    mesh:
      model: ../models/Avocado.glb
    transformAnimation:
      axis: [0, 0, 1]
      speed: 0.785398163
  - id: skeletal-panel
    parent: scene-root
    transform:
      translation: [0, -0.5, 0]
      rotation: [0, 0, 0]
      scale: [0.01, 0.01, 0.01]
    mesh:
      model: ../models/Fox.glb
    animation:
      clip: Walk
      speed: 1
      loop: true
      playing: true