version: 1
entities:
  - id: scene-root
    transform:
      translation: [0, 0, 0]
      rotation: [0, 0, 0]
      scale: [1, 1, 1]
  - id: main-camera
    camera:
      position: [2, 2, 2]
      rotation: [-0.615479709, 0, 0.785398163]
      fov: 45
      near: 0.1
      active: true
  - id: key-light
    transform:
      translation: [-2, 2.5, 1]
      rotation: [0, 0, 0]
      scale: [1, 1, 1]
    light:
      color: [1, 0.92, 0.78]
      intensity: 18
      ambient: [0.12, 0.12, 0.12]
      active: true
  - id: static-avocado
    parent: scene-root
    transform:
      translation: [-1.1, 0, 0]
      rotation: [0, 0, 0]
      scale: [12, 12, 12]
    mesh:
      model: ../models/Avocado.glb
  - id: animated-avocado
    parent: scene-root
    transform:
      translation: [1.1, 0, 0]
      rotation: [0, 0, 0]
      scale: [12, 12, 12]
    mesh:
      model: ../models/Avocado.glb
    transformAnimation:
      axis: [0, 1, 0]
      speed: 0.785398163
  # The KTX 2 plating through the texture coordinates of a cube sphere and of a ring around it.
  - id: plated-sphere
    parent: scene-root
    transform:
      translation: [-0.3, 0.75, 1.3]
      rotation: [0, 0.6, 0]
      scale: [0.16, 0.16, 0.16]
    mesh:
      shape: cubesphere
      material: materials/panels.material.yaml
  - id: plated-ring
    parent: plated-sphere
    transform:
      rotation: [0.35, 0, 0.2]
      scale: [1.9, 1.9, 1.9]
    mesh:
      shape: ring
      color: [0.5, 0.49, 0.47]
      innerRadius: 0.62
      material: materials/panels.material.yaml
  - id: skeletal-panel
    parent: scene-root
    transform:
      translation: [0, 0, -0.5]
      rotation: [0, 0, 0]
      scale: [0.01, 0.01, 0.01]
    mesh:
      model: ../models/Fox.glb
    animation:
      clip: Walk
      speed: 1
      loop: true
      playing: true