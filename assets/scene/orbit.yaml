# A station in low orbit over a planet, at real scale, from the Halcyon system: the large-world
# scene phase 4's exit criterion is judged on. The bodies are placed by the system each frame; the
# camera orbits the station (W, A, S, D, Q, E, or drag with the right mouse button), C moves it to
# the next body, and F2 draws the orbits.
version: 1
system: ../systems/halcyon.yaml
entities:
  - id: halcyon
    celestial:
      body: Halcyon
    sun:
      color: [1, 0.95, 0.88]
      intensity: 1.1
  - id: ostra
    celestial:
      body: Ostra
    transform:
      scale: [6371000, 6371000, 6371000]
    mesh:
      shape: sphere
      color: [0.16, 0.3, 0.55]
  - id: pell
    celestial:
      body: Pell
    transform:
      scale: [1737400, 1737400, 1737400]
    mesh:
      shape: cubesphere
      color: [0.45, 0.44, 0.42]
  - id: highport
    celestial:
      body: Ostra Highport
  # The hub and the dock are cylinders along the station's z axis: a cylinder's axis is its y, turned
  # a quarter turn about x. The plating is the hull material's, projected along each part's axes.
  - id: highport-hub
    parent: highport
    transform:
      rotation: [1.5707963, 0, 0]
      scale: [6, 30, 6]
    mesh:
      shape: cylinder
      color: [0.72, 0.72, 0.76]
      material: materials/hull.material.yaml
  - id: highport-collar
    parent: highport
    transform:
      translation: [0, 0, 12]
      rotation: [1.5707963, 0, 0]
      scale: [16, 16, 16]
    mesh:
      shape: ring
      color: [0.62, 0.62, 0.66]
      innerRadius: 0.4
      material: materials/hull.material.yaml
  - id: highport-dock
    parent: highport
    transform:
      translation: [0, 0, -34]
      rotation: [1.5707963, 0, 0]
      scale: [3, 4, 3]
    mesh:
      shape: cylinder
      color: [0.85, 0.6, 0.2]
  - id: highport-beacon
    parent: highport
    transform:
      translation: [0, 0, -38.6]
      scale: [0.6, 0.6, 0.6]
    mesh:
      shape: icosphere
      material: materials/beacon.material.yaml
  - id: highport-truss
    parent: highport
    transform:
      scale: [44, 0.8, 0.8]
    mesh:
      shape: box
      color: [0.5, 0.5, 0.52]
      material: materials/hull.material.yaml
  - id: highport-panel-port
    parent: highport
    transform:
      translation: [-56, 0, 0]
      scale: [12, 0.15, 7]
    mesh:
      shape: box
      color: [0.1, 0.14, 0.35]
  - id: highport-panel-starboard
    parent: highport
    transform:
      translation: [56, 0, 0]
      scale: [12, 0.15, 7]
    mesh:
      shape: box
      color: [0.1, 0.14, 0.35]
  - id: camera
    camera:
      fov: 50
      near: 0.5
      active: true
      orbit:
        target: highport
        distance: 160
        # About fifty degrees off the station's zenith at time 0, so the planet is behind it.
        yaw: 0.8
        pitch: -0.1
        minDistance: 20
