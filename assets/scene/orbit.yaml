# A station in low orbit over a planet, at real scale, from the Halcyon system: the large-world
# scene phase 4's exit criterion is judged on. The bodies are placed by the system each frame; the
# camera orbits the station (W, A, S, D, Q, E, or drag with the right mouse button), C moves it to
# the next body, F2 draws the orbits and the lights' reach, F3 shows the lights per cluster, and F4
# the sun's shadow cascades. The bodies the file does not present (the jump gate) are built from the
# system, the station from its layout, and the dev tools' Scene panel (F1) shows and hides the layers.
version: 2
system: systems/halcyon.yaml
entities:
  - id: halcyon
    celestial:
      body: Halcyon
    # Irradiance in the HDR target's units: about pi, so a white Lambertian surface facing the sun
    # shows white, and an albedo shows as itself.
    sun:
      color: [1, 0.95, 0.88]
      intensity: 3.4
  # Halcyon's sky: the starfield, the galaxy's band across it and a faint nebula. It is also what
  # the station's night side and its reflections are lit by.
  - id: halcyon-sky
    sky:
      seed: 7
      stars: 6000
      starFlux: 3.0e-5
      band:
        normal: [0.35, 0.86, -0.37]
        width: 0.22
        color: [0.055, 0.048, 0.04]
      nebula:
        color: [0.026, 0.011, 0.034]
        scale: 2
  # Ostra's surface is the planet program's, read by latitude and longitude from the direction out
  # of its centre; the colour is what it shows if the material cannot be drawn.
  - id: ostra
    celestial:
      body: Ostra
    transform:
      scale: [6371000, 6371000, 6371000]
    mesh:
      shape: sphere
      # The colour map's mean, linear, which the environment's capture draws the planet with.
      color: [0.2, 0.24, 0.23]
      material: materials/habitable-earthlike-a.material.yaml
    # Earth's air, as the component's defaults are: the blue limb, the haze over the surface and the
    # sunlight reddened at the terminator.
    atmosphere: {}
  - id: pell
    celestial:
      body: Pell
    transform:
      scale: [1737400, 1737400, 1737400]
    mesh:
      shape: cubesphere
      color: [0.45, 0.44, 0.42]
  # Ostra Highport is drawn from its layout (defs/stations/ostra-highport.yaml) under this entity
  # as the system scene is built: its decks, piers and pads, the paint and the floodlights about each
  # pad, the lamps showing each pad's state, the bays' doors and the display wing's ships (the
  # station dressing, app/src/Dressing.h). Its lights are assigned to the clusters they reach (F3
  # shows how many each cluster has, F2 their reach).
  - id: highport
    celestial:
      body: Ostra Highport
  - id: camera
    camera:
      fov: 50
      near: 0.5
      active: true
      orbit:
        target: highport
        # Far enough out that all of the station's 1.5 km is in view, and near enough that its lights
        # are within the 2 km the clusters reach, which the smoke test's cluster check needs; kept
        # outside its sphere, 763 m, so the camera never sits in its hub.
        distance: 1500
        # About fifty degrees off the station's zenith at time 0, so the planet is behind it.
        yaw: 0.8
        pitch: -0.1
        minDistance: 840
