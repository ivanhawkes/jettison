# A station in low orbit over a planet, at real scale, from the Halcyon system: the large-world
# scene phase 4's exit criterion is judged on. The bodies are placed by the system each frame; the
# camera orbits the station (W, A, S, D, Q, E, or drag with the right mouse button), C moves it to
# the next body, F2 draws the orbits and the lights' reach, F3 shows the lights per cluster, and F4
# the sun's shadow cascades.
version: 1
system: ../systems/halcyon.yaml
entities:
  - id: halcyon
    celestial:
      body: Halcyon
    # Irradiance in the HDR target's units: about pi, so a white Lambertian surface facing the sun
    # shows white, and an albedo shows as itself.
    sun:
      color: [1, 0.95, 0.88]
      intensity: 3.4
  # Halcyon's sky: the starfield, the galaxy's band across it and a faint nebula. It is also what
  # the station's night side and its reflections are lit by.
  - id: halcyon-sky
    sky:
      seed: 7
      stars: 6000
      starFlux: 3.0e-5
      band:
        normal: [0.35, 0.86, -0.37]
        width: 0.22
        color: [0.055, 0.048, 0.04]
      nebula:
        color: [0.026, 0.011, 0.034]
        scale: 2
  - id: ostra
    celestial:
      body: Ostra
    transform:
      scale: [6371000, 6371000, 6371000]
    mesh:
      shape: sphere
      color: [0.16, 0.3, 0.55]
  - id: pell
    celestial:
      body: Pell
    transform:
      scale: [1737400, 1737400, 1737400]
    mesh:
      shape: cubesphere
      color: [0.45, 0.44, 0.42]
  - id: highport
    celestial:
      body: Ostra Highport
  # The hub and the dock are cylinders along the station's z axis: a cylinder's axis is its y, turned
  # a quarter turn about x. The plating is the hull material's, projected along each part's axes.
  - id: highport-hub
    parent: highport
    transform:
      rotation: [1.5707963, 0, 0]
      scale: [6, 30, 6]
    mesh:
      shape: cylinder
      color: [0.72, 0.72, 0.76]
      material: materials/hull.material.yaml
  - id: highport-collar
    parent: highport
    transform:
      translation: [0, 0, 12]
      rotation: [1.5707963, 0, 0]
      scale: [16, 16, 16]
    mesh:
      shape: ring
      color: [0.62, 0.62, 0.66]
      innerRadius: 0.4
      material: materials/hull.material.yaml
  - id: highport-dock
    parent: highport
    transform:
      translation: [0, 0, -34]
      rotation: [1.5707963, 0, 0]
      scale: [3, 4, 3]
    mesh:
      shape: cylinder
      color: [0.85, 0.6, 0.2]
  - id: highport-beacon
    parent: highport
    transform:
      translation: [0, 0, -38.6]
      scale: [0.6, 0.6, 0.6]
    mesh:
      shape: icosphere
      material: materials/beacon.material.yaml
  - id: highport-truss
    parent: highport
    transform:
      scale: [44, 0.8, 0.8]
    mesh:
      shape: box
      color: [0.5, 0.5, 0.52]
      material: materials/hull.material.yaml
  - id: highport-panel-port
    parent: highport
    transform:
      translation: [-56, 0, 0]
      scale: [12, 0.15, 7]
    mesh:
      shape: box
      color: [0.1, 0.14, 0.35]
  - id: highport-panel-starboard
    parent: highport
    transform:
      translation: [56, 0, 0]
      scale: [12, 0.15, 7]
    mesh:
      shape: box
      color: [0.1, 0.14, 0.35]
  # The station's lights, assigned to the clusters they reach (F3 shows how many each cluster has,
  # F2 their reach). Four floodlights near the rim of the collar's dock-side face wash the hub,
  # leaning in towards it; a spot points along its entity's -Z, which is the station's dock direction
  # here. Each beam's axis meets the hub 21 m off and 23 degrees from grazing, where the intensity
  # gives about the sun's irradiance.
  - id: highport-flood-dorsal
    parent: highport
    transform:
      translation: [0, 14, 11]
      rotation: [-0.4, 0, 0]
    light:
      type: spot
      color: [0.9, 0.95, 1]
      intensity: 3400
      range: 60
      innerConeAngle: 0.3
      outerConeAngle: 0.45
  - id: highport-flood-ventral
    parent: highport
    transform:
      translation: [0, -14, 11]
      rotation: [0.4, 0, 0]
    light:
      type: spot
      color: [0.9, 0.95, 1]
      intensity: 3400
      range: 60
      innerConeAngle: 0.3
      outerConeAngle: 0.45
  - id: highport-flood-port
    parent: highport
    transform:
      translation: [-14, 0, 11]
      rotation: [0, -0.4, 0]
    light:
      type: spot
      color: [0.9, 0.95, 1]
      intensity: 3400
      range: 60
      innerConeAngle: 0.3
      outerConeAngle: 0.45
  - id: highport-flood-starboard
    parent: highport
    transform:
      translation: [14, 0, 11]
      rotation: [0, 0.4, 0]
    light:
      type: spot
      color: [0.9, 0.95, 1]
      intensity: 3400
      range: 60
      innerConeAngle: 0.3
      outerConeAngle: 0.45
  # The dock's approach lights: two warm spots on the hub's end, leaning in onto the dock.
  - id: highport-dock-light-port
    parent: highport
    transform:
      translation: [-5, 0, -30.5]
      rotation: [0, -0.35, 0]
    light:
      type: spot
      color: [1, 0.8, 0.55]
      intensity: 200
      range: 20
      innerConeAngle: 0.3
      outerConeAngle: 0.5
  - id: highport-dock-light-starboard
    parent: highport
    transform:
      translation: [5, 0, -30.5]
      rotation: [0, 0.35, 0]
    light:
      type: spot
      color: [1, 0.8, 0.55]
      intensity: 200
      range: 20
      innerConeAngle: 0.3
      outerConeAngle: 0.5
  # The beacon's light, beside its lamp, steady where the lamp blinks; and the navigation lights at
  # the panels' tips, red to port and green to starboard.
  - id: highport-beacon-light
    parent: highport
    transform:
      translation: [0, 0, -39.6]
    light:
      color: [1, 0.15, 0.08]
      intensity: 25
      range: 12
  - id: highport-nav-port
    parent: highport
    transform:
      translation: [-68.5, 0.5, 0]
    light:
      color: [1, 0.05, 0.03]
      intensity: 30
      range: 15
  - id: highport-nav-starboard
    parent: highport
    transform:
      translation: [68.5, 0.5, 0]
    light:
      color: [0.05, 1, 0.2]
      intensity: 30
      range: 15
  # Work lights over the truss.
  - id: highport-truss-light-port
    parent: highport
    transform:
      translation: [-30, 2, 0]
    light:
      color: [1, 0.95, 0.85]
      intensity: 40
      range: 14
  - id: highport-truss-light-starboard
    parent: highport
    transform:
      translation: [30, 2, 0]
    light:
      color: [1, 0.95, 0.85]
      intensity: 40
      range: 14
  - id: camera
    camera:
      fov: 50
      near: 0.5
      active: true
      orbit:
        target: highport
        distance: 160
        # About fifty degrees off the station's zenith at time 0, so the planet is behind it.
        yaw: 0.8
        pitch: -0.1
        minDistance: 20
