# The market at Ostra Anchorage, over the same world's mines: it digs more iron, copper and
# phosphorus than it smelts or uses, and has to buy the grain, beer, medicine and electronics the
# farming station Ostra Highport sells it, a short cruise away. A market of the sample game
# (docs/sample-game.md), in crates; production and consumption are a market tick's.
version: 1
station: Ostra Anchorage
system: Halcyon
feeBps: 130
goods:
  - {good: wheat-seeds, stock: 20, production: 0, consumption: 1, target: 40}
  - {good: flour, stock: 18, production: 0, consumption: 1, target: 40}
  - {good: beer, stock: 12, production: 0, consumption: 1, target: 30}
  - {good: iron, stock: 80, production: 3, consumption: 1, target: 60}
  - {good: copper, stock: 50, production: 2, consumption: 1, target: 40}
  - {good: phosphorus, stock: 45, production: 2, consumption: 1, target: 40}
  - {good: antibiotics, stock: 8, production: 0, consumption: 1, target: 20}
  - {good: electronics, stock: 10, production: 0, consumption: 1, target: 20}
