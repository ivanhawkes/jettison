# The hull plating through the mesh's own texture coordinates rather than triplanar: the sample
# scene's cube sphere, one face of plating to each face of the cube.
version: 1
program: mesh
parameters:
  - name: metallicRoughness
    value: [0.4, 0.38, 0, 0]
textures:
  - slot: baseColor
    path: textures/hull_panels.ktx2
