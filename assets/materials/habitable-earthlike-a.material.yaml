# A habitable, Earth-like planet: Render::MaterialDefinition (render/Material.h), on the planet
# program. The maps are the artist's pack imported by scripts/import-planet-textures.sh, 4096 square
# by longitude and latitude, with a detail layer repeated ten times over them each way.
version: 1
program: planet
parameters:
  # The detail at full strength, ten repeats each way as the pack has it.
  - name: detail
    value: [10, 10, 1, 1]
  # The height map's sea floor is flat at 63 and 64 of 255, and the coasts rise from 65; the detail
  # comes on from just above it and is whole by about 74. The detail colour's mean is 152 of 255,
  # so dividing by it adds contrast without brightening the land.
  - name: land
    value: [0.26, 0.03, 0.597, 0]
textures:
  - slot: color
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-color.ktx2
  - slot: normal
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-normal.ktx2
  - slot: height
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-height.ktx2
  - slot: roughness
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-roughness.ktx2
  - slot: detailColor
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-detail-color.ktx2
  - slot: detailNormal
    path: textures/planets/habitable-earthlike-a/habitable-earthlike-a-detail-normal.ktx2
