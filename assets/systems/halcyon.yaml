# A sample system at real scale: a Sun-like star, an Earth-like planet with a moon, a station in
# low orbit and a jump point, the lane to Vesper. SI units: metres, seconds, radians, GM in
# m^3/s^2. A period left out is derived from the parent's gravitational parameter.
version: 1
name: Halcyon
bodies:
  - name: Halcyon
    kind: Star
    radius: 6.957e8
    gravitationalParameter: 1.32712440018e20
    rotation:
      period: 2192832
      axialTilt: 0.1265
  - name: Ostra
    kind: Planet
    parent: Halcyon
    radius: 6.371e6
    gravitationalParameter: 3.986004418e14
    orbit:
      semiMajorAxis: 1.496e11
      eccentricity: 0.0167
      inclination: 0.0
      longitudeOfAscendingNode: 0.0
      argumentOfPeriapsis: 1.7967
      meanAnomalyAtEpoch: 6.2400
    rotation:
      period: 86164.0905
      axialTilt: 0.4091
  - name: Ostra Highport
    kind: Station
    # Built to its layout (defs/stations/ostra-highport.yaml), 1.5 km across, whose sphere its
    # radius is.
    layout: ostra-highport
    parent: Ostra
    radius: 763
    orbit:
      semiMajorAxis: 6.791e6
      eccentricity: 0.0005
      inclination: 0.9006
      longitudeOfAscendingNode: 1.2
      argumentOfPeriapsis: 0.4
      # Over the day side at time 0, which the sample scene opens on.
      meanAnomalyAtEpoch: 3.1416
  - name: Pell
    kind: Moon
    parent: Ostra
    radius: 1.7374e6
    gravitationalParameter: 4.9048695e12
    orbit:
      semiMajorAxis: 3.844e8
      eccentricity: 0.0549
      inclination: 0.0898
      longitudeOfAscendingNode: 2.1831
      argumentOfPeriapsis: 5.5528
      meanAnomalyAtEpoch: 2.3554
    rotation:
      period: 2360591.5
      axialTilt: 0.0269
  # A second station over Ostra, a mining block's, where Highport is a farming one (Manifest keeps
  # several to a planet, one over each economic block). Built to its layout
  # (defs/stations/ostra-anchorage.yaml), 600 m across, whose sphere its radius is. Its orbit is
  # another plane, higher than Highport's, so the two are a cruise apart and never near.
  - name: Ostra Anchorage
    kind: Station
    layout: ostra-anchorage
    parent: Ostra
    radius: 303
    orbit:
      semiMajorAxis: 7.6e6
      eccentricity: 0.001
      inclination: 0.5
      longitudeOfAscendingNode: 3.0
      argumentOfPeriapsis: 1.0
      meanAnomalyAtEpoch: 0.8
  # The lane to Vesper (galaxy.yaml), a moon gate: a short hop's, in orbit about the planet, 50,000
  # km out, past the stations and inside Pell's. Its radius is the ring a ship flies through. A ship
  # comes out of it at rest in its own frame, facing Ostra, and cruises on to a station.
  - name: Halcyon Gate
    kind: JumpPoint
    parent: Ostra
    radius: 500
    orbit:
      semiMajorAxis: 5.0e7
      inclination: 0.3
      longitudeOfAscendingNode: 0.4
      argumentOfPeriapsis: 0.0
      meanAnomalyAtEpoch: 4.2
