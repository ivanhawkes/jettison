# A red dwarf with a hot gas giant close in, a refinery station over the giant, and two jump points:
# the lanes to Halcyon and to Marrow (galaxy.yaml). SI units, at real scale, as halcyon.yaml is.
version: 1
name: Vesper
bodies:
  - name: Vesper
    kind: Star
    radius: 2.9e8
    gravitationalParameter: 5.97e19
    rotation:
      period: 3.6e6
      axialTilt: 0.05
  - name: Corva
    kind: Planet
    parent: Vesper
    radius: 7.0e7
    gravitationalParameter: 1.27e17
    orbit:
      semiMajorAxis: 3.0e10
      eccentricity: 0.012
      inclination: 0.02
      longitudeOfAscendingNode: 0.6
      argumentOfPeriapsis: 2.1
      meanAnomalyAtEpoch: 0.4
    rotation:
      period: 36000
      axialTilt: 0.05
  - name: Corva Refinery
    kind: Station
    # Built to its layout (defs/stations/corva-refinery.yaml), 600 m across, whose sphere its
    # radius is.
    layout: corva-refinery
    parent: Corva
    radius: 303
    orbit:
      semiMajorAxis: 1.4e8
      eccentricity: 0.001
      inclination: 0.3
      longitudeOfAscendingNode: 2.4
      argumentOfPeriapsis: 0.9
      meanAnomalyAtEpoch: 1.7
  # The lane to Halcyon, a moon gate, in orbit about Corva 500,000 km out, past the refinery's
  # 140,000 km and where Corva pulls at 0.03 m/s², and the lane to Marrow, a star gate: in a close
  # orbit about the star, a ring that gathers the star's energy (Manifest's idea, "Star Gates / Moon
  # Gates"). A ship comes out of either at rest in its own frame, facing the nearest planet.
  - name: Vesper Gate
    kind: JumpPoint
    parent: Corva
    radius: 500
    orbit:
      semiMajorAxis: 5.0e8
      inclination: 0.2
      longitudeOfAscendingNode: 2.0
      argumentOfPeriapsis: 0.0
      meanAnomalyAtEpoch: 1.0
  - name: Vesper Deep Gate
    kind: JumpPoint
    parent: Vesper
    radius: 500
    orbit:
      semiMajorAxis: 1.0e9
      inclination: 0.1
      longitudeOfAscendingNode: 0.0
      argumentOfPeriapsis: 0.0
      meanAnomalyAtEpoch: 3.5
