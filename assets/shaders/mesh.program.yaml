# The default scene program: Render::ProgramDefinition (render/Material.h). Every glTF primitive and
# procedural shape without a material of its own draws with it, at these defaults and with the
# model's own base-colour texture. Its parameters are vec4s; a material file sets them by name. It
# is glTF's metallic-roughness model, lit through shaders/include/lighting.glsl.
version: 1
parameters:
  - name: baseColor
    default: [1, 1, 1, 1]
  # rgb: colour, a: intensity in the HDR target's linear units.
  - name: emissive
    default: [0, 0, 0, 0]
  # x: metallic, y: perceptual roughness, each 0 to 1 and multiplied by the metallicRoughness
  # texture's blue and green channels, as glTF packs them.
  - name: metallicRoughness
    default: [0, 0.6, 0, 0]
textures:
  - name: baseColor
    fallback: White
  - name: emissive
    fallback: White
  - name: metallicRoughness
    fallback: White
