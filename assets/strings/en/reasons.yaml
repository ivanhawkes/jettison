# Why the simulation refused something or gave it up (sim/Reason.h): a key a module's reason
# enumerator names, reason.<module>.<name>, worded by app/src/Reasons.cpp. Arguments are {0}, {1}, by
# position, as the module's enumeration lists them; a key with "one" and "other" is chosen by its first
# number.
version: 1
reason:
  # An entity a reason names that has no name to show.
  entity: something
  dock:
    vehicle_gone: the vehicle is not in the world
    not_controller: its sender does not command the vehicle
    not_a_platform: it is not a platform
    no_vehicle: the vehicle is of no kind the docks know
    cannot_fly: the vehicle is not one that flies
    other_frame: the vehicle is not in {0}'s frame
    other_local_frame: the vehicle is not in {0}'s local frame
    already_queued: the vehicle is already waiting for a berth at {0}
    already_holds_berth: the vehicle already holds berth {0} at {1}
    no_berth_fits: "{0} has no berth the vehicle fits"
    holds_nothing: the vehicle holds no berth and waits for none
    already_leaving: the vehicle is already leaving its berth
    no_berth_offers: "{0} has no berth the vehicle fits that offers what it asks for"
  ai:
    no_such_entity: there is no such vehicle
    destination_gone: its destination has gone
    destination_other_frame: its destination is in another frame
    destination_other_local_frame: its destination is in another local frame
    not_controller: its sender does not command the vehicle
    no_pilot: no one in particular cannot take a helm
    helm_held: someone else is at the vehicle's helm
    not_at_helm: its sender is not at the vehicle's helm
    no_such_tree: there is no behaviour {0}
  physics:
    not_at_helm: its sender is not at the vehicle's helm
