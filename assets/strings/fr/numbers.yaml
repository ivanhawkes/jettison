# How French writes a number, a date and a time of day (StringTable::Number, Decimal, Date and
# Time; their arguments are in en/numbers.yaml): its thousands grouped by a no-break space.
version: 1
numbers:
  thousands: "\u00A0"
  decimal: ","
  date: "{2:02}/{1:02}/{0}"
  time: "{0:02}:{1:02}"
  clock: "24"
