# Ostra Highport, the farming world's trade hub (docs/sample-game.md): twelve destroyer pads for the
# largest transports on four piers of three, reaching out from a hub along the station's +X, -X, +Z and
# -Z, 1.5 km across, within the 2 km cluster range from its centre (docs/roadmap.md, "Decided"). A
# station layout of the docks (Dock.PlatformLayout), in the station's axes, metres.
#
# The hub is 200 m square and 60 m deep. Each pier is 660 m long, 120 m wide and 20 m deep, its top 10 m
# above the station's middle; its three 80 x 180 m pads lie along it, 30 m apart and 20 m in from its
# sides, their noses pointing out along it, so the largest transports on two of them are 70 m apart end
# to end.
# Pads 11 and 12, the two furthest out along -Z, offer a dry dock, where the sample repairs a damaged
# ship (a pad's features, Dock.PadLayout).
#
# The display wing fills the quarter between the +X and +Z piers, 440 x 460 m and as deep as they are,
# joined to both and to the hub's corner: two cruiser bays for a liner and a cruiser, noses out along
# +X, and four corvette pads in a row beyond them for fighters. Display pads are dressing
# (Dock.PadLayout): no ship is given one, and each names the hull drawn on it. The wing's far corner is
# 721 m out, inside the sphere the piers' tips make, 762 m.
