# Ostra Anchorage, over the mining block of Ostra (docs/sample-game.md), laid out as Corva Refinery is:
# four frigate pads for transports on two piers along the station's +X and -X, and two corvette pads for
# shuttles on the hub's top, 600 m across. A station layout of the docks (Dock.PlatformLayout), in the
# station's axes, metres.
#
# The hub is 120 m square and 40 m deep. Each pier is 240 m long, 80 m wide and 16 m deep, its top 8 m
# above the station's middle, with two 50 x 90 m pads along it 20 m apart, their noses pointing out
# along it. The corvette pads lie side by side on the hub's top, noses to -Z.
version: 2
displayName: Ostra Anchorage
reservationSeconds: 300
decks:
  - {centre: [0, 0, 0], size: [120, 40, 120]}
piers:
  - {centre: [180, 0, 0], size: [240, 16, 80]}
  - {centre: [-180, 0, 0], size: [240, 16, 80]}
berths:
  - {class: frigate, position: [125, 8, 0], heading: [1, 0, 0]}
  - {class: frigate, position: [235, 8, 0], heading: [1, 0, 0]}
  - {class: frigate, position: [-125, 8, 0], heading: [-1, 0, 0]}
  - {class: frigate, position: [-235, 8, 0], heading: [-1, 0, 0]}
  - {class: corvette, position: [-25, 20, -10], heading: [0, 0, -1]}
  - {class: corvette, position: [25, 20, -10], heading: [0, 0, -1]}
