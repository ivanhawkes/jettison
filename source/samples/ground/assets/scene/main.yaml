version: 2
entities:
  - id: camera
    camera:
      position: [0, 4, 10]
      rotation: [-0.3, 0, 0]
      fov: 60
      near: 0.1
      active: true
  - id: lamp
    transform:
      translation: [0, 30, 10]
    light:
      type: point
      color: [1, 0.95, 0.85]
      intensity: 4000
      range: 200
      active: true
  # The ground as its physics shape has it (src/Ground.cpp): a box's scale is its half-extents. The
  # rover's proxy is the game's, made as the scene loads (GroundGame::BindProxy).
  - id: ground
    transform:
      translation: [0, -0.5, 0]
      scale: [200, 0.5, 200]
    mesh:
      shape: box
      color: [0.35, 0.45, 0.3]
