version: 2
entities:
  - id: camera
    camera:
      position: [0, 4, 10]
      rotation: [-0.3, 0, 0]
      fov: 60
      near: 0.1
      active: true
  - id: lamp
    transform:
      translation: [0, 30, 10]
    light:
      type: point
      color: [1, 0.95, 0.85]
      intensity: 4000
      range: 200
      active: true
  # The ground and the rover as the physics shapes have them (src/Ground.cpp): a box's scale is its
  # half-extents.
  - id: ground
    transform:
      translation: [0, -0.5, 0]
      scale: [200, 0.5, 200]
    mesh:
      shape: box
      color: [0.35, 0.45, 0.3]
  # The rover's proxy, which the game binds to the rover (GroundGame::SceneLoaded).
  - id: rover
    transform:
      translation: [0, 0.4, 0]
      scale: [1, 0.4, 1.5]
    mesh:
      shape: box
      color: [0.8, 0.45, 0.15]
