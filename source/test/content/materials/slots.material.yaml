# The sixteen-slot fixture (shaders/slots.program.yaml) with a texture in twelve of its slots, seven
# of them past the eighth, and three textures each in two slots; slots 3, 4, 5 and 14 are left to
# their fallbacks, white, black, a flat normal and black.
