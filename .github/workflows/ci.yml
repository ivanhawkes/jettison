name: ci

# main only: a run is about 45 runner minutes, and every commit has already passed ci.sh locally.
# A branch is run by hand before a merge (gh workflow run ci --ref <branch>).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # tidy's cache, in the workspace where the cache step can save it. Its per-unit keys digest
      # clang-tidy's version, .clang-tidy, the unit's compile command and the contents of every
      # file the unit includes, so a restored entry is only ever reused by the unit that earned it.
      JETTISON_TIDY_CACHE: ${{ github.workspace }}/.tidy-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Restore clang-tidy cache
        uses: actions/cache@v4
        with:
          # The stage's 786 s of a 2 732 s gate is the cold sweep of all 252 units
          # (docs/build-and-gates.md, "clang-tidy"); the cache answers it, and post-if: always() so
          # a run that fails on findings still saves the units that came out clean.
          path: ${{ github.workspace }}/.tidy-cache
          key: tidy-${{ runner.os }}-${{ hashFiles('.clang-tidy') }}-${{ github.sha }}
          restore-keys: |
            tidy-${{ runner.os }}-${{ hashFiles('.clang-tidy') }}-
          post: true
          post-if: always()

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Gate (format, build, headless render test)
        shell: bash -euo pipefail {0}
        run: devenv shell -- ./scripts/ci.sh --llvmpipe --werror 2>&1 | tee ci.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
