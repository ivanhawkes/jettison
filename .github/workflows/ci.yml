name: ci

# main only, and by hand (gh workflow run ci --ref <branch>). Every commit has passed ci.sh locally;
# CI shows only that a clean checkout builds and runs on Ubuntu: the headless preset built, and its
# smoke test from the packed assets on lavapipe (the user's, 2026-11-25).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      # The smoke test's own build keeps its output to itself, so a compiler's errors are shown here.
      - name: Build (clang-headless)
        shell: bash -euo pipefail {0}
        run: >-
          devenv shell -- bash -c 'cmake --preset clang-headless -DJETTISON_WERROR=ON
          && cmake --build --preset clang-headless' 2>&1 | tee ci.log

      - name: Smoke test (packed, lavapipe, virtual display)
        shell: bash -euo pipefail {0}
        run: >-
          devenv shell -- ./scripts/smoke-test.sh --preset clang-headless --build --xvfb --llvmpipe
          --packed --werror 2>&1 | tee -a ci.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
