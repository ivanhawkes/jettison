name: ci

# The gate lives in scripts/ci.sh, so './scripts/ci.sh --llvmpipe' locally is the same run.
# CI executes it *inside the devenv shell*, so the workflow and a developer's terminal use
# the one environment definition this repo has: devenv.nix. No apt, no setup actions for
# clang, glslc, validation layers, X11, Xvfb or lavapipe: the shell provides clang 21,
# cmake, ninja, shaderc, the validation layers, the X11 development libraries, Xvfb,
# mesa.drivers for lavapipe and git-lfs. Substitutes come from cache.nix.org and devenv's
# global cache; ~/.cache/nix is restored between runs.

on:
  push:
    branches:
      - main
      - feature-base
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # Assets are Git LFS objects and the render test loads them, so fetch them properly.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore nix substitute cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nix
          key: nix-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-keys: |
            nix-

      - name: Nix
        uses: cachix/install-nix-action@v30
        with:
          # Inputs come from GitHub-hosted archives (devenv-nixpkgs, FetchContent tags);
          # an authenticated API budget avoids a spurious 404 mid-run.
          extra_nix_config: |
            extra-access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # No official devenv GitHub action exists any more (cachix/devenv-action has no refs),
      # so install devenv itself from its flake, pinned to the version that produced
      # devenv.lock. That keeps CI and the local shell on the same tool.
      - name: devenv
        run: |
          set -euo pipefail
          nix profile install --refresh 'github:cachix/devenv/v2.4.0'
          devenv --version

      # Evaluates the dev shell; the gate then runs inside it, exactly as it does locally.
      - name: Gate (format, build, headless render test)
        shell: bash -euo pipefail {0}
        run: devenv -c './scripts/ci.sh --llvmpipe' 2>&1 | tee ci.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
