name: ci

on:
  push:
    branches:
      - main
      - feature-base
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      JETTISON_TIDY_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2

      - name: Enable devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Gate (format, build, headless render test)
        shell: bash -euo pipefail {0}
        run: devenv shell -- ./scripts/ci.sh --llvmpipe --werror 2>&1 | tee ci.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
